name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "core/**"
      - "modules/**"
      - "tests/**"
      - "saved_models/**"
      - "chroma_db/**"
      - "requirements-docker.txt"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "core/**"
      - "modules/**"
      - "tests/**"
      - "saved_models/**"
      - "chroma_db/**"
      - "requirements-docker.txt"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - run: pip install -r requirements-docker.txt pytest
      # Tests marked "live" need Neo4j and OpenAI; they are skipped here because
      # no credentials are configured (see tests/conftest.py).
      - run: python -m pytest tests -q
      # The app must import and answer the liveness probe without any credentials.
      - name: Liveness smoke test
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from api.main import app
          r = TestClient(app).get("/api/healthz")
          assert r.status_code == 200 and r.json() == {"status": "ok"}, r.text
          EOF
