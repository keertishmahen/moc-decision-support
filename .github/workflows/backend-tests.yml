name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "core/**"
      - "modules/**"
      - "loaders/**"
      - "tests/**"
      - "data/**"
      - "scripts/**"
      - "docs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "README.md"
      - "pyproject.toml"
      - "saved_models/**"
      - "chroma_db/**"
      - "requirements-docker.txt"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "core/**"
      - "modules/**"
      - "loaders/**"
      - "tests/**"
      - "data/**"
      - "scripts/**"
      - "docs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "README.md"
      - "pyproject.toml"
      - "saved_models/**"
      - "chroma_db/**"
      - "requirements-docker.txt"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - run: pip install -r requirements-docker.txt pytest ruff

      # Lint: base rules on the whole backend, strict rules on code written since v3.0.
      - name: Lint (base)
        run: python -m ruff check api core modules loaders tests scripts/generate_docs.py
      - name: Lint (strict, new code)
        run: >
          python -m ruff check
          core/allocation core/llm core/allocation_lookup.py modules/decision_allocation
          api/routes api/errors.py loaders/snapshot_loader.py loaders/allocation_loader.py
          scripts/generate_docs.py
          tests/allocation tests/api tests/llm tests/modules tests/structure tests/file_graph.py
          --select E,F,W,B,I

      # Offline suite: model reproduction, service and API on a file-backed graph, layer rule,
      # documentation checks. Tests marked "live" need Neo4j and OpenAI and skip themselves here.
      - name: Tests
        run: python -m pytest tests

      # The app must import and answer the liveness probe without any credentials.
      - name: Liveness smoke test
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          r = c.get("/api/healthz")
          assert r.status_code == 200 and r.json() == {"status": "ok"}, r.text
          r = c.get("/api/allocation/analysis/enumeration")
          assert r.json()["allocations"] == {"AI_LED": 62, "AI_SUPPORTED": 406, "HUMAN_LED": 2124}, r.text
          EOF
